<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="How to use The Silk Serum: mist two to three sprays, work through hair, then air dry">
  <defs>
    <filter id="htuSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <rect x="12" y="12" width="696" height="196" rx="14" fill="#faf9f7"/>

  <!-- step numerals -->
  <text x="140" y="52" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="30" fill="#8a7357">1</text>
  <text x="360" y="52" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="30" fill="#8a7357">2</text>
  <text x="580" y="52" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="30" fill="#8a7357">3</text>

  <!-- connectors -->
  <g stroke="#c9c2b6" stroke-width="1.6" stroke-dasharray="3 5">
    <line x1="196" y1="120" x2="304" y2="120"/>
    <line x1="416" y1="120" x2="524" y2="120"/>
  </g>
  <path d="M298,113 L306,120 L298,127" fill="none" stroke="#c9c2b6" stroke-width="1.6"/>
  <path d="M518,113 L526,120 L518,127" fill="none" stroke="#c9c2b6" stroke-width="1.6"/>

  <!-- ===== icon 1: spray bottle misting ===== -->
  <g transform="translate(134,124)" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-14" y="-24" width="28" height="66" rx="7"/>
    <rect x="-8" y="-40" width="16" height="16" rx="2"/>
    <path d="M-8,-46 L4,-46 L4,-40 L-8,-40 Z" fill="#e9e0cf"/>
    <line x1="4" y1="-43" x2="10" y2="-43"/>
  </g>
  <g transform="translate(134,124)" stroke="#8a7357" stroke-width="1.8" stroke-linecap="round">
    <line x1="18" y1="-52" x2="26" y2="-56"/>
    <line x1="20" y1="-43" x2="30" y2="-43"/>
    <line x1="18" y1="-34" x2="26" y2="-30"/>
  </g>

  <!-- ===== icon 2: fingertips working strand ===== -->
  <g transform="translate(360,120)" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round">
    <path d="M-34,-30 C-20,-38 -8,-30 0,-14"/>
    <path d="M34,-30 C20,-38 8,-30 0,-14"/>
    <path d="M0,-14 C-6,4 6,20 -2,40"/>
    <path d="M0,-14 C6,4 -6,20 2,40"/>
  </g>

  <!-- ===== icon 3: smooth hair + shine (air dry) ===== -->
  <g transform="translate(580,120)">
    <g fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round">
      <path d="M-14,-38 C-18,-16 -8,4 -12,26 C-14,34 -10,42 -8,46"/>
      <path d="M0,-40 C-4,-18 6,2 2,24 C0,32 4,40 6,44"/>
      <path d="M14,-38 C10,-16 20,4 16,26 C14,34 18,42 20,46"/>
    </g>
    <path d="M-12,-36 C-16,-16 -6,2 -10,22" fill="none" stroke="#ffffff" stroke-width="2.6" opacity=".7" filter="url(#htuSoft)"/>
    <g stroke="#8a7357" stroke-width="1.5" stroke-linecap="round">
      <path d="M32,-30 l0,12 M26,-24 l12,0"/>
      <path d="M38,-6 l0,8 M34,-2 l8,0"/>
    </g>
  </g>
</svg>
