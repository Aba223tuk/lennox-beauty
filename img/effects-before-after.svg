<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 640" role="img" aria-label="Before and after using The Silk Serum: frizzy hair becomes smooth and glossy">
  <defs>
    <filter id="ebaSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- panels -->
  <rect x="14" y="14" width="312" height="286" rx="14" fill="#faf9f7"/>
  <rect x="14" y="330" width="312" height="296" rx="14" fill="#faf9f7"/>

  <!-- labels -->
  <text x="46" y="56" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#8a8378">BEFORE</text>
  <text x="46" y="372" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#8a7357">AFTER</text>

  <!-- ===== frizzy strands (before) ===== -->
  <g fill="none" stroke="#8a8378" stroke-width="3.4" stroke-linecap="round" opacity=".9">
    <path d="M138,90 C118,116 148,138 124,164 C102,186 132,208 108,232 C88,252 116,272 100,292"/>
    <path d="M170,88 C192,112 160,136 184,160 C206,182 174,204 198,228 C218,248 190,270 208,290"/>
    <path d="M202,90 C182,114 212,136 190,160 C170,182 198,204 178,228 C162,248 188,268 172,292"/>
  </g>
  <!-- flyaway ticks -->
  <g stroke="#a9a297" stroke-width="2.2" stroke-linecap="round">
    <line x1="120" y1="128" x2="100" y2="116"/>
    <line x1="188" y1="140" x2="212" y2="126"/>
    <line x1="102" y1="196" x2="80" y2="186"/>
    <line x1="204" y1="206" x2="226" y2="198"/>
    <line x1="126" y1="252" x2="106" y2="244"/>
    <line x1="182" y1="260" x2="202" y2="272"/>
  </g>
  <!-- static sparks -->
  <g stroke="#b5ac9d" stroke-width="1.8">
    <path d="M154,78 l0,12 M148,84 l12,0"/>
    <path d="M222,166 l0,10 M217,171 l10,0"/>
  </g>

  <!-- ===== smooth strands (after) ===== -->
  <g fill="none" stroke="#2a2a28" stroke-width="3.1" stroke-linecap="round">
    <path d="M132,406 C124,452 144,490 136,536 C130,568 140,600 148,624"/>
    <path d="M168,404 C162,450 180,488 172,534 C166,568 176,600 184,624"/>
    <path d="M204,406 C196,452 214,490 206,536 C200,568 210,600 218,624"/>
  </g>
  <!-- sheen highlight -->
  <path d="M140,412 C132,454 150,490 142,534" fill="none" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round" opacity=".7" filter="url(#ebaSoft)"/>
  <!-- shine sparkle -->
  <g stroke="#8a7357" stroke-width="2" stroke-linecap="round">
    <path d="M256,440 l0,16 M248,448 l16,0"/>
    <path d="M270,478 l0,10 M265,483 l10,0"/>
  </g>
</svg>
