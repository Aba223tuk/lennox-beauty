<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Illustration comparing frizzy hair with flyaways before The Silk Serum to smooth, glossy hair after">
  <defs>
    <filter id="baSheen" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="baCard"><rect x="0" y="0" width="1200" height="820" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#baCard)">
    <!-- panels: the "before" side sits a shade cooler and duller than the "after" -->
    <rect x="0" y="0" width="600" height="820" fill="#f3f1ec"/>
    <rect x="600" y="0" width="600" height="820" fill="#fcfbf9"/>
  </g>

  <!-- ===== BEFORE: frizz, flyaways, static ===== -->
  <g fill="none" stroke="#8f887c" stroke-width="7" stroke-linecap="round" opacity=".92">
    <path d="M232,175 C196,235 250,285 204,345 C162,400 216,450 172,510 C136,560 190,610 158,672"/>
    <path d="M300,170 C340,232 288,282 332,342 C372,398 316,448 358,508 C394,558 340,608 372,672"/>
    <path d="M368,176 C332,236 384,286 340,346 C300,402 352,452 310,512 C274,562 326,612 296,672"/>
  </g>
  <g fill="none" stroke="#a49c8f" stroke-width="5.5" stroke-linecap="round" opacity=".8">
    <path d="M266,182 C300,240 250,288 292,346 C328,398 278,446 316,504"/>
    <path d="M334,182 C300,240 350,288 308,346 C272,398 322,446 284,504"/>
  </g>
  <!-- flyaways -->
  <g stroke="#b3ab9d" stroke-width="4.5" stroke-linecap="round">
    <line x1="206" y1="262" x2="150" y2="232"/>
    <line x1="392" y1="288" x2="452" y2="256"/>
    <line x1="176" y1="404" x2="118" y2="380"/>
    <line x1="418" y1="424" x2="478" y2="404"/>
    <line x1="192" y1="548" x2="136" y2="530"/>
    <line x1="400" y1="566" x2="458" y2="588"/>
    <line x1="222" y1="340" x2="170" y2="318"/>
    <line x1="378" y1="612" x2="430" y2="636"/>
  </g>
  <!-- static -->
  <g stroke="#bdb4a4" stroke-width="4" stroke-linecap="round">
    <path d="M420,168 l0,26 M407,181 l26,0"/>
    <path d="M156,470 l0,20 M146,480 l20,0"/>
  </g>

  <!-- ===== AFTER: smooth, laid flat, glossy ===== -->
  <g fill="none" stroke="#2a2a28" stroke-width="7" stroke-linecap="round">
    <path d="M840,172 C822,290 852,400 834,516 C820,606 838,652 852,692"/>
    <path d="M900,168 C884,288 912,398 894,514 C880,604 898,652 912,692"/>
    <path d="M960,172 C944,290 972,400 954,516 C940,606 958,652 972,692"/>
  </g>
  <g fill="none" stroke="#454540" stroke-width="5.5" stroke-linecap="round" opacity=".85">
    <path d="M870,178 C854,292 882,402 864,518 C852,600 866,646 878,684"/>
    <path d="M930,178 C914,292 942,402 924,518 C912,600 926,646 938,684"/>
  </g>
  <!-- sheen -->
  <path d="M856,210 C840,320 868,420 852,520" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity=".75" filter="url(#baSheen)"/>
  <path d="M946,230 C930,336 958,428 942,520" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".55" filter="url(#baSheen)"/>
  <!-- shine -->
  <g stroke="#8a7357" stroke-width="4.5" stroke-linecap="round">
    <path d="M1030,300 l0,34 M1013,317 l34,0"/>
    <path d="M1064,372 l0,22 M1053,383 l22,0"/>
    <path d="M792,438 l0,22 M781,449 l22,0"/>
  </g>

  <!-- divider -->
  <line x1="600" y1="46" x2="600" y2="774" stroke="#ddd8ce" stroke-width="2.5"/>

  <!-- labels -->
  <text x="64" y="98" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="7" fill="#8f887c">BEFORE</text>
  <text x="664" y="98" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="7" fill="#8a7357">AFTER</text>

  <!-- honest footnote: this is a drawing, not a photographed result -->
  <text x="600" y="782" text-anchor="middle" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="500" letter-spacing="2" fill="#9a9184">Illustration</text>

  <rect x="1" y="1" width="1198" height="818" rx="22" fill="none" stroke="#e8e4dc" stroke-width="2"/>
</svg>
