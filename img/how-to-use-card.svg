<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="How to use The Silk Serum in three steps: mist two to three sprays over mid-lengths and ends, comb it through, then air dry or blow-dry. No rinsing.">
  <defs>
    <style>
      .ttl{font-family:Georgia,'Cormorant Garamond',serif;fill:#141414}
      .num{font-family:Georgia,'Cormorant Garamond',serif;fill:#8a7357}
      .hd {font-family:-apple-system,'Segoe UI',Inter,sans-serif;fill:#141414;font-weight:600}
      .bd {font-family:-apple-system,'Segoe UI',Inter,sans-serif;fill:#5c5c5c}
      .ic {fill:none;stroke:#141414;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .ac {fill:none;stroke:#8a7357;stroke-width:4;stroke-linecap:round}
    </style>
  </defs>

  <rect x="8" y="8" width="984" height="984" rx="22" fill="#ffffff" stroke="#ececec" stroke-width="2"/>

  <text class="ttl" x="500" y="122" text-anchor="middle" font-size="64">How to use</text>
  <text class="bd"  x="500" y="170" text-anchor="middle" font-size="27">Under a minute, start to finish</text>
  <line x1="360" y1="212" x2="640" y2="212" stroke="#ececec" stroke-width="2"/>

  <!-- ============ step 1 — mist ============ -->
  <circle cx="196" cy="360" r="86" fill="#faf9f7"/>
  <g transform="translate(196,360)">
    <g class="ic">
      <rect x="-26" y="-26" width="52" height="82" rx="12"/>
      <rect x="-15" y="-56" width="30" height="30" rx="4"/>
      <path d="M-15,-68 L8,-68 L8,-56 L-15,-56 Z"/>
      <line x1="8" y1="-62" x2="22" y2="-62"/>
    </g>
    <g class="ac">
      <line x1="34" y1="-78" x2="52" y2="-86"/>
      <line x1="38" y1="-62" x2="60" y2="-62"/>
      <line x1="34" y1="-46" x2="52" y2="-38"/>
    </g>
  </g>
  <text class="num" x="330" y="330" font-size="34">1</text>
  <text class="hd"  x="366" y="332" font-size="37">Mist 2–3 sprays</text>
  <text class="bd"  x="330" y="382" font-size="27">Over mid-lengths and ends, about a</text>
  <text class="bd"  x="330" y="418" font-size="27">hand's width away from the hair.</text>

  <!-- ============ step 2 — comb through ============ -->
  <circle cx="196" cy="600" r="86" fill="#faf9f7"/>
  <g transform="translate(196,600)">
    <g class="ic">
      <path d="M-52,-34 h84 a10,10 0 0 1 10,10 v16 h-104 v-16 a10,10 0 0 1 10,-10 z"/>
      <line x1="-40" y1="-8" x2="-40" y2="34"/>
      <line x1="-20" y1="-8" x2="-20" y2="40"/>
      <line x1="0"   y1="-8" x2="0"   y2="42"/>
      <line x1="20"  y1="-8" x2="20"  y2="40"/>
      <line x1="40"  y1="-8" x2="40"  y2="34"/>
    </g>
    <path class="ac" d="M-64,44 C-30,58 30,58 64,40"/>
  </g>
  <text class="num" x="330" y="570" font-size="34">2</text>
  <text class="hd"  x="366" y="572" font-size="37">Comb it through</text>
  <text class="bd"  x="330" y="622" font-size="27">Work it evenly from the mid-lengths</text>
  <text class="bd"  x="330" y="658" font-size="27">down. No rinsing — it's a leave-in.</text>

  <!-- ============ step 3 — dry ============ -->
  <circle cx="196" cy="840" r="86" fill="#faf9f7"/>
  <g transform="translate(196,840)">
    <g class="ic" stroke-width="4.6">
      <path d="M-34,-56 C-40,-22 -22,10 -30,44 C-33,56 -27,66 -24,72"/>
      <path d="M-2,-58 C-8,-24 10,6 4,38 C1,50 7,62 10,68"/>
      <path d="M30,-56 C24,-22 42,10 34,44 C31,56 37,66 40,72"/>
    </g>
    <g fill="#8a7357" stroke="none">
      <path d="M62,-48 C64,-37 69,-32 80,-30 C69,-28 64,-23 62,-12 C60,-23 55,-28 44,-30 C55,-32 60,-37 62,-48 Z"/>
      <path d="M80,4 C81,11 84,14 91,15 C84,16 81,19 80,26 C79,19 76,16 69,15 C76,14 79,11 80,4 Z"/>
    </g>
  </g>
  <text class="num" x="330" y="810" font-size="34">3</text>
  <text class="hd"  x="366" y="812" font-size="37">Air dry or blow-dry</text>
  <text class="bd"  x="330" y="862" font-size="27">Dries down silky, never greasy, with</text>
  <text class="bd"  x="330" y="898" font-size="27">a soft scent that stays all day.</text>
</svg>
